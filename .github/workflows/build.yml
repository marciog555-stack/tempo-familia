# Compila o APK a cada push e publica numa Release do GitHub (só na branch principal).
name: Compilar APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'meu-shape/**'
      - '.github/workflows/meu-shape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Compilar APK assinado
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk "TempoFamilia-v1.0.${{ github.run_number }}.apk"

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: TempoFamilia-v1.0.${{ github.run_number }}
          path: TempoFamilia-v1.0.${{ github.run_number }}.apk

      - name: Publicar Release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tempo Família v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TempoFamilia-v1.0.${{ github.run_number }}.apk
          body: |
            Baixe o arquivo **TempoFamilia-v1.0.${{ github.run_number }}.apk** abaixo e abra no celular.
            Se já tiver uma versão instalada, esta instala por cima (mesma assinatura), sem perder as configurações.
